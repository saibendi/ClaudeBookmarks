<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Bookmarks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="desk-view">

  <div class="desk">
    <div class="calendar-scene">
      <div class="calendar-face" id="calendarFace"></div>
    </div>
    <div class="month-nav">
      <button id="prevYearBtn" aria-label="Previous year">&#171;</button>
      <button id="prevBtn" aria-label="Previous month">&#8592;</button>
      <span id="navLabel"></span>
      <button id="nextBtn" aria-label="Next month">&#8594;</button>
      <button id="nextYearBtn" aria-label="Next year">&#187;</button>
    </div>
    <a class="categories-portal" href="categories.html">&#128193; Categories</a>
  </div>

  <script src="data.js"></script>
  <script src="data_tiktok.js" onerror="window.TIKTOK_DATES = null; window.TIKTOK_VIDEOS = null;"></script>
  <script>
    // Merge tweet + TikTok counts into one date → count map for the calendar.
    const BOOKMARK_DATA = {};
    for (const [date, count] of Object.entries(window.BOOKMARK_DATES || {})) {
      BOOKMARK_DATA[date] = (BOOKMARK_DATA[date] || 0) + count;
    }
    for (const [date, count] of Object.entries(window.TIKTOK_DATES || {})) {
      BOOKMARK_DATA[date] = (BOOKMARK_DATA[date] || 0) + count;
    }

    // ── Notification snapshot (localStorage diff) ─────────────────────────────
    // NEW_COUNTS[date] = how many new bookmarks since the snapshot was saved.
    // If undefined, the day has no new bookmarks (show green checkmark instead).
    const _snap = JSON.parse(localStorage.getItem('bookmark_snapshot') || '{}');
    const NEW_COUNTS = {};
    for (const [date, count] of Object.entries(BOOKMARK_DATA)) {
      // TEMPORARY (added 2026-08-06, revert once the TikTok urls.md backfill
      // is done): suppress new-item badges for any date outside 2026 — the
      // backfill adds hundreds of pre-2026 dates we're not reviewing day by
      // day right now, just categorizing. Remove this "if" to restore normal
      // notifications for every date.
      if (!date.startsWith('2026-')) continue;
      const prev = _snap[date] || 0;
      if (count > prev) NEW_COUNTS[date] = count - prev;
    }

    // ── Constants ─────────────────────────────────────────────────────────────
    const MONTH_NAMES = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December"
    ];
    const DOW_LABELS = ["S","M","T","W","T","F","S"];

    // Today's date string
    const today = new Date();
    const todayStr = formatDate(today.getFullYear(), today.getMonth() + 1, today.getDate());

    // Current view: restores wherever you last left it (e.g. before clicking
    // into a day), falls back to this month/year on first-ever visit.
    const _lastView = JSON.parse(localStorage.getItem('calendar_last_view') || 'null');
    let currentYear  = _lastView ? _lastView.year  : today.getFullYear();
    let currentMonth = _lastView ? _lastView.month : today.getMonth();

    // ── Helper: zero-pad to 2 digits ──────────────────────────────────────────
    function pad2(n) { return String(n).padStart(2, '0'); }

    function formatDate(y, m, d) {
      return `${y}-${pad2(m)}-${pad2(d)}`;
    }

    // ── SVG spiral ring ───────────────────────────────────────────────────────
    function makeSpiralRingSVG() {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "20");
      svg.setAttribute("height", "30");
      svg.setAttribute("viewBox", "0 0 14 22");
      svg.setAttribute("aria-hidden", "true");

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", [
        "M 7 2",
        "C 13 2, 13 6, 7 6",
        "C 1 6, 1 10, 7 10",
        "C 13 10, 13 14, 7 14",
        "C 1 14, 1 18, 7 18",
        "C 13 18, 13 20, 7 20"
      ].join(" "));
      path.setAttribute("stroke", "#B0B0B0");
      path.setAttribute("stroke-width", "1.8");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke-linecap", "round");

      svg.appendChild(path);
      return svg;
    }

    // ── Build one month card ──────────────────────────────────────────────────
    function buildMonthCard(year, monthIndex) {
      const monthNum = monthIndex + 1;

      const card = document.createElement("div");
      card.className = "month-card";

      // ── Rings strip ──
      const ringsRow = document.createElement("div");
      ringsRow.className = "month-rings";
      for (let i = 0; i < 13; i++) {
        ringsRow.appendChild(makeSpiralRingSVG());
      }
      card.appendChild(ringsRow);

      // ── Red header ──
      const header = document.createElement("div");
      header.className = "month-header";
      header.textContent = `${MONTH_NAMES[monthIndex].toUpperCase()} ${year} \u00b7 Bookmarks`;
      card.appendChild(header);

      // ── Day-of-week labels ──
      const dowRow = document.createElement("div");
      dowRow.className = "dow-row";
      DOW_LABELS.forEach(label => {
        const cell = document.createElement("div");
        cell.className = "dow-cell";
        cell.textContent = label;
        dowRow.appendChild(cell);
      });
      card.appendChild(dowRow);

      // ── Calendar body ──
      const firstDay = new Date(year, monthIndex, 1);
      const startDow = firstDay.getDay();
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

      const cells = [];
      for (let i = 0; i < startDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);
      while (cells.length % 7 !== 0) cells.push(null);

      const weeks = [];
      for (let i = 0; i < cells.length; i += 7) {
        weeks.push(cells.slice(i, i + 7));
      }

      weeks.forEach(week => {
        // Compute Sunday of this week
        const firstDay = week.find(d => d !== null);
        let sundayStr = null;
        if (firstDay !== null) {
          const d = new Date(year, monthIndex, firstDay);
          d.setDate(d.getDate() - d.getDay());
          sundayStr = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
        }

        // Check if any day in this week has bookmarks
        const hasBookmarks = week
          .filter(d => d !== null)
          .some(d => BOOKMARK_DATA[formatDate(year, monthNum, d)]);

        const weekRow = document.createElement("div");
        weekRow.className = "week-row";

        week.forEach(day => {
          if (day === null) {
            const empty = document.createElement("div");
            empty.className = "day-tile empty";
            weekRow.appendChild(empty);
          } else {
            const dateStr = formatDate(year, monthNum, day);
            const tile = document.createElement("a");
            tile.className = "day-tile";
            tile.href = `day.html?date=${dateStr}`;
            tile.textContent = day;

            if (dateStr === todayStr) {
              tile.classList.add("today");
            }

            const count = BOOKMARK_DATA[dateStr];
            if (count !== undefined) {
              if (count >= 10) {
                tile.classList.add("density-high");
              } else if (count >= 4) {
                tile.classList.add("density-mid");
              } else {
                tile.classList.add("density-low");
              }

              // Notification indicator: +N badge if new, checkmark if seen
              const indicator = document.createElement("span");
              if (NEW_COUNTS[dateStr]) {
                indicator.className = "new-badge";
                indicator.textContent = `+${NEW_COUNTS[dateStr]}`;
                tile.classList.add("tile-new");
              } else {
                indicator.className = "seen-check";
                indicator.textContent = "\u2713";
              }
              tile.appendChild(indicator);

              // Mark this day as seen on click (before navigation)
              tile.addEventListener("click", () => {
                const snap = JSON.parse(localStorage.getItem('bookmark_snapshot') || '{}');
                snap[dateStr] = BOOKMARK_DATA[dateStr];
                localStorage.setItem('bookmark_snapshot', JSON.stringify(snap));
                tile.classList.remove("tile-new");

                // Save current tweet + TikTok IDs so day.html can diff for new-item tinting
                const TWEETS  = window.BOOKMARK_TWEETS || {};
                const TIKTOKS = window.TIKTOK_VIDEOS || {};
                const daySnap = JSON.parse(localStorage.getItem('day_tweet_snapshot') || '{}');
                daySnap[dateStr] = [...(TWEETS[dateStr] || []), ...(TIKTOKS[dateStr] || [])].map(t => t.id);
                localStorage.setItem('day_tweet_snapshot', JSON.stringify(daySnap));
              });
            }

            weekRow.appendChild(tile);
          }
        });

        // Stats button (floats outside card to the right)
        if (hasBookmarks && sundayStr) {
          const btn = document.createElement("a");
          btn.className = "week-stats-btn";
          btn.href = `stats.html?weekStart=${sundayStr}`;
          btn.title = "Week stats";
          btn.innerHTML = `<svg width="13" height="11" viewBox="0 0 13 11" aria-hidden="true">
            <rect x="0" y="5" width="3" height="6" rx="1" fill="currentColor"/>
            <rect x="5" y="2" width="3" height="9" rx="1" fill="currentColor"/>
            <rect x="10" y="0" width="3" height="11" rx="1" fill="currentColor"/>
          </svg>`;
          weekRow.appendChild(btn);
        }

        card.appendChild(weekRow);
      });

      return card;
    }

    // ── Render current month ──────────────────────────────────────────────────
    function render() {
      const face = document.getElementById("calendarFace");
      face.innerHTML = "";
      face.appendChild(buildMonthCard(currentYear, currentMonth));
      document.getElementById("navLabel").textContent =
        `${MONTH_NAMES[currentMonth]} ${currentYear}`;
      localStorage.setItem('calendar_last_view', JSON.stringify({ year: currentYear, month: currentMonth }));
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      } else if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      render();
    }

    function changeYear(delta) {
      currentYear += delta;
      render();
    }

    document.getElementById("prevBtn").addEventListener("click", () => changeMonth(-1));
    document.getElementById("nextBtn").addEventListener("click", () => changeMonth(1));
    document.getElementById("prevYearBtn").addEventListener("click", () => changeYear(-1));
    document.getElementById("nextYearBtn").addEventListener("click", () => changeYear(1));

    render();
  </script>

</body>
</html>
